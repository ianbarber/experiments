[project]
name = "fwlayer"
version = "0.1.0"
description = "Paired retrieval traces and causal interventions in frozen hybrid language models"
requires-python = ">=3.12,<3.14"
dependencies = [
  "torch==2.12.0", "transformers==5.9.0", "flash-linear-attention==0.5.0",
  "factworld", "numpy==2.5.4", "matplotlib==3.11.2", "safetensors==0.8.0", "huggingface-hub==1.33.0", "accelerate==1.15.0",
]

[project.scripts]
fwlayer = "fwlayer.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
factworld = { path = "vendor/factworld", editable = true }
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
