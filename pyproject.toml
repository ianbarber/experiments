[project]
name = "llm-op-evolution"
version = "0.1.0"
description = "Track LLM operator graph density across generations via torch.export"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.5.0",
    "transformers>=4.45.0",
    "accelerate>=0.34.0",
    "matplotlib>=3.8.0",
    "pyyaml>=6.0",
    "pandas>=2.0.0",
    "seaborn>=0.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_op_evolution"]